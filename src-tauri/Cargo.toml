[package]
name = "zhihuishu-answer"
version = "1.4.0"
description = "智慧树答题"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zhihuishu_answer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
