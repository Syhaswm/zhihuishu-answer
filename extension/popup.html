<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font: 13px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2933;
      background: #f7f4ec;
    }
    label { display: block; margin-bottom: 4px; color: #52606d; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #d6d0c4;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 7px 8px;
      border: 0;
      border-radius: 8px;
      background: #1f4d3a;
      color: #f7f4ec;
      cursor: pointer;
    }
    p { min-height: 1.2em; color: #52606d; }
  </style>
</head>
<body>
  <label for="key">DeepSeek API Key</label>
  <input id="key" type="password" autocomplete="off" spellcheck="false" />
  <label for="model">模型</label>
  <input id="model" type="text" value="deepseek-chat" />
  <button id="save" type="button">保存</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
