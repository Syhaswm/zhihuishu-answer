# 在 GitHub 云端从 Gitee 拉取发行版附件，避免本机火绒等误删临时目录里的 Setup.exe。
name: Mirror Gitee releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync releases from Gitee to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_GIT_PUSH: "1"
        run: gh auth status && python scripts/mirror_gitee_releases_to_github.py --skip-git
